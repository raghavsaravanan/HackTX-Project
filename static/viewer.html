<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumi · Live camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="viewer">
  <main>
    <header>
      <h1>Live phone camera</h1>
      <p id="status" class="status" data-state="idle">Connecting to server…</p>
    </header>

    <section>
      <div class="video-wrap">
        <video id="remote" autoplay playsinline muted></video>
        <canvas id="relay" hidden></canvas>
        <div id="placeholder" class="placeholder">
          <img id="qr" alt="QR code linking to the phone page" width="200" height="200">
          <p>Scan with your phone (same Wi-Fi), or open<br><a id="phone-url" href="#"></a></p>
        </div>
      </div>
      <div class="row stats-row">
        <p id="stats" class="stats"></p>
        <button id="fullscreen" type="button">Fullscreen</button>
      </div>
    </section>
  </main>
  <script type="module" src="/static/js/viewer.js"></script>
</body>
</html>
